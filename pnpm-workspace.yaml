packages:
  - packages/*
  - examples/*

onlyBuiltDependencies:
  - esbuild

# Single source of truth for the SignalX core version this repo builds against.
# Every pin below is one caret range `^X.Y.0`, and `pnpm sync:core X.Y` is the
# only thing that should edit it. Pre-1.0 that meant a single MINOR
# (`^0.Y.0` == `>=0.Y.0 <0.(Y+1).0`); from core 1.0 a caret spans the MAJOR
# (`^1.0.0` == `>=1.0.0 <2.0.0`), which is what core's semver now promises:
# 1.x minors are additive, so one range covers them all. (Stated without a
# concrete version on purpose — the values under `catalog:` get rewritten, this
# comment does not, and a version named here went stale across 0.12 → 0.13.)
# The point of ONE range for every core package is unchanged: @sigx/reactivity
# keeps reactive state in module-local variables, so two physical copies
# silently split core's singletons and break reactivity — matching ranges let
# pnpm hoist ONE copy. Consumed via `"catalog:"` in package.json; `pnpm pack`
# rewrites it to the concrete range.
catalog:
  "@sigx/reactivity": ^1.0.0
  "@sigx/resume": ^1.0.0
  "@sigx/runtime-core": ^1.0.0
  "@sigx/runtime-dom": ^1.0.0
  "@sigx/server": ^1.0.0
  "@sigx/server-renderer": ^1.0.0
  "@sigx/vite": ^1.0.0
  sigx: ^1.0.0
